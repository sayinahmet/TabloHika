<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tablolar</title>

  <link rel="icon" href="./assets/logo-120.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/logo-120.png">

  <style>
    :root{
      --border:#e5e7eb;
      --text:#0f172a;
      --muted:#475569;
      --primary:#00b0e8;
      --primary2:#4fd1ff;
      --shadow: 0 10px 24px rgba(15, 23, 42, .06);
    }

    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; color:var(--text); background:#fff; }

    header{
      padding: 12px 14px;
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      position: sticky;
      top: 0;
      background:#fff;
      z-index: 50;
    }
    header .title{ font-weight:900; }
    header .hint{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .layout{
      display:grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 57px);
    }

    .sidebar{
      border-right:1px solid var(--border);
      padding: 14px;
      background: #fafafa;
    }

    .searchrow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .searchbox{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .searchbox:focus-within{
      border-color: rgba(0,176,232,.6);
      box-shadow: 0 14px 32px rgba(0,176,232,.18);
      transform: translateY(-1px);
    }

    .search-ico{ font-size:14px; opacity:.75; user-select:none; }

    .search{
      width:100%;
      border:0 !important;
      outline:none;
      font-size:14px;
      background:transparent;
      padding:0 !important;
      margin:0 !important;
      color: var(--text);
    }
    .search::placeholder{ color:#94a3b8; }

    .clear{
      border:0;
      background:#f1f5f9;
      color:#64748b;
      width:28px;
      height:28px;
      border-radius:10px;
      cursor:pointer;
      display:none;
      font-size:18px;
      line-height:0;
      padding:0;
      transition: background .15s ease, transform .15s ease;
    }
    .clear:hover{ background:#e2e8f0; transform: scale(1.03); }

    .badge{
      min-width: 44px;
      text-align:center;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size:12px;
      font-weight:800;
      user-select:none;
    }

    .group{ margin-top: 10px; }
    .group-title{
      font-size:12px;
      letter-spacing:.3px;
      color:var(--muted);
      font-weight:800;
      margin: 10px 4px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .group-title .subhint{ font-weight:700; color:#64748b; font-size:11px; }

    .btn{
      width:100%;
      text-align:left;
      padding:10px 12px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:12px;
      cursor:pointer;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      transition: .15s transform, .15s box-shadow, .15s border-color;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      border-color:#cfe8f7;
    }
    .btn.active{
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(0,176,232,.18);
    }
    .btn .name{ font-weight:900; }
    .btn .meta{ font-size:12px; color:var(--muted); }

    .empty{
      padding: 10px 12px;
      border:1px dashed #cbd5e1;
      background:#fff;
      border-radius:12px;
      color:#64748b;
      font-weight:800;
      font-size:13px;
    }

    .main{ padding: 14px; background:#fff; }
    .frame-wrap{
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.06);
      background:#fff;
    }

    /* ✅ iframe wrapper: mobilde scale uygulayacağız */
    .frame-scale{
      width:100%;
      height: calc(100vh - 115px);
      overflow:hidden;
      background:#fff;
      position:relative;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
      transform-origin: top left;
    }

    /* ✅ Mobile App-like Drawer */
    .menu-btn{
      display:none;
      border:1px solid var(--border);
      background:#fff;
      border-radius:12px;
      width:44px;
      height:44px;
      font-size:20px;
      box-shadow: var(--shadow);
      cursor:pointer;
      flex:0 0 auto;
    }
    .head{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .overlay{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(15,23,42,.45);
      z-index: 60;
    }

    @media (max-width: 980px){
      /* layout artık tek kolon, ama sidebar drawer olacak */
      .layout{ grid-template-columns: 1fr; }
      .main{ padding: 10px; }
      .frame-scale{ height: calc(100vh - 86px); } /* header payı */

      .menu-btn{ display:inline-flex; align-items:center; justify-content:center; }

      .sidebar{
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: min(92vw, 360px);
        transform: translateX(-105%);
        transition: transform .22s ease;
        z-index: 70;
        border-right:1px solid var(--border);
        border-bottom:none;
        padding-top: 72px; /* header yüksekliği */
        background:#fafafa;
      }

      body.drawer-open .sidebar{ transform: translateX(0); }
      body.drawer-open .overlay{ display:block; }
    }
    /* Drawer header */
.drawer-head{
  display:none;
  position: fixed;
  top: 0;
  left: 0;
  width: min(92vw, 360px);
  height: 64px;
  padding: 10px 14px;
  border-bottom:1px solid var(--border);
  background:#fafafa;
  z-index: 71;
  align-items:center;
  justify-content:space-between;
}
.drawer-title{ font-weight:900; color:var(--text); }

.drawer-close{
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  width:44px;
  height:44px;
  cursor:pointer;
  box-shadow: var(--shadow);
  font-size:18px;
}

/* Kenardan swipe için görünmez alan */
.edge-swipe{
  display:none;
  position: fixed;
  top: 0;
  left: 0;
  width: 18px;
  height: 100vh;
  z-index: 65;
}

@media (max-width: 980px){
  .drawer-head{ display:flex; }
  .edge-swipe{ display:block; }
}


    /* ✅ Full-screen loader + progress (seninki aynen) */
    .loader{
      position: fixed;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      z-index: 9999;
      opacity: 1;
      transition: opacity .25s ease;
    }
    .loader.hide{ opacity: 0; pointer-events: none; }
    .loader-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius: 18px;
      padding: 18px 18px 16px;
      width: min(400px, calc(100vw - 32px));
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
      text-align:center;
    }
    .loader-logo{
      width:54px;
      height:54px;
      border-radius:14px;
      display:block;
      margin: 2px auto 10px;
      box-shadow: 0 10px 26px rgba(0,0,0,.10);
    }
    .spinner{
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 4px solid rgba(0,176,232,.20);
      border-top-color: rgba(0,176,232,.95);
      margin: 8px auto 12px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
    .loader-title{ font-weight: 900; letter-spacing: .2px; color: var(--text); }
    .loader-sub{ margin-top: 4px; font-size: 13px; color: var(--muted); }
    .progress{ margin-top: 12px; text-align:left; }
    .progress-top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:8px; color: var(--muted); font-size:12px; font-weight:800;
    }
    .bar{
      height: 10px; border-radius: 999px; background: rgba(148,163,184,.30);
      overflow:hidden; border:1px solid rgba(229,231,235,.8);
    }
    .fill{
      height:100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      transition: width .18s ease; position:relative;
    }
    .fill::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(255,255,255,.0), rgba(255,255,255,.35), rgba(255,255,255,.0));
      transform: translateX(-60%); animation: shine 1.1s ease-in-out infinite; opacity:.9;
    }
    @keyframes shine{ to{ transform: translateX(60%); } }
  </style>
</head>

<body>
  <!-- ✅ Loader Overlay -->
  <div id="loader" class="loader">
    <div class="loader-card">
      <img class="loader-logo" src="./assets/logo-120.png" alt="Logo">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loader-title">Tablolar Yükleniyor…</div>
      <div class="loader-sub" id="loaderSub">Liste hazırlanıyor</div>

      <div class="progress" aria-label="Yükleme ilerlemesi">
        <div class="progress-top">
          <span id="progressLabel">Başlatılıyor</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="bar">
          <div id="progressFill" class="fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Drawer overlay -->
  <div id="overlay" class="overlay"></div>
  <div id="edgeSwipe" class="edge-swipe"></div>

  <header>
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Menü">☰</button>
    <div class="head">
      <div class="title">Tablolar</div>
      <div id="activeTitle" class="hint">Mobilde menüden seçim yap</div>
    </div>
    <div class="hint" style="max-width:34vw; text-align:right;">(<b>/</b> ile ara)</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="drawer-head">
  <div class="drawer-title">Raporlar</div>
  <button id="closeDrawerBtn" class="drawer-close" type="button" aria-label="Kapat">✕</button>
</div>
      <div class="searchrow">
        <div class="searchbox">
          <span class="search-ico" aria-hidden="true">🔎</span>
          <input id="q" class="search" placeholder="Tablo ara (ör. hatay, adıyaman, araç)..." />
          <button id="clearBtn" class="clear" type="button" title="Temizle" aria-label="Temizle">×</button>
        </div>
        <div id="countBadge" class="badge" title="Sonuç sayısı">0</div>
      </div>

      <div class="group">
        <div class="group-title">
          <span>Raporlar</span>
          <span id="status" class="subhint"></span>
        </div>
        <div id="list"></div>
      </div>
    </aside>

    <main class="main">
      <div class="frame-wrap">
        <div id="frameScale" class="frame-scale">
          <iframe id="frame" loading="lazy"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script>
    const WEBAPP = "https://script.google.com/macros/s/AKfycbyA8NpgRWFjlZV47sEu7KGvL_zOVpeJpk8UaH6K5ZFkbvTwPaS76Tj1vtOhuK9LnFMQHg/exec";
    const SSID   = "15NX2Fxi9ifIBbjtToNtFvrYksLRTF7G3qdJw1AJMk0I";

    let TABLES = [];
    let progTimer = null;
    let prog = 0;

    function buildUrl(t){
      const params = new URLSearchParams({
        ss: SSID,
        sheet: t.sheet,
        range: t.range,
        skip: String(t.skip ?? 1),
        v: String(Date.now())
      });
      return `${WEBAPP}?${params.toString()}`;
    }

    async function loadTables(){
      const url = `${WEBAPP}?mode=list&ss=${encodeURIComponent(SSID)}&v=${Date.now()}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data || !data.ok) throw new Error(data?.error || "List fetch failed");
      TABLES = data.tables || [];
    }

    const listEl = document.getElementById("list");
    const frameEl = document.getElementById("frame");
    const frameScaleEl = document.getElementById("frameScale");
    const qEl = document.getElementById("q");
    const clearBtn = document.getElementById("clearBtn");
    const countBadge = document.getElementById("countBadge");
    const statusEl = document.getElementById("status");
    const activeTitleEl = document.getElementById("activeTitle");

    // drawer
    const menuBtn = document.getElementById("menuBtn");
    const overlayEl = document.getElementById("overlay");
    function openDrawer(){ document.body.classList.add("drawer-open"); }
    function closeDrawer(){ document.body.classList.remove("drawer-open"); }
    menuBtn.addEventListener("click", openDrawer);
    overlayEl.addEventListener("click", closeDrawer);

    // loader elements
    const loaderEl = document.getElementById("loader");
    const loaderSubEl = document.getElementById("loaderSub");
    const progressFillEl = document.getElementById("progressFill");
    const progressPctEl = document.getElementById("progressPct");
    const progressLabelEl = document.getElementById("progressLabel");

    function showLoader(){
      loaderEl && loaderEl.classList.remove("hide");
      startFakeProgress();
    }

    function hideLoader(){
      stopFakeProgress();
      setProgress(100, "Hazır", "Tamamlandı");
      setTimeout(() => {
        if (!loaderEl) return;
        loaderEl.classList.add("hide");
        setTimeout(() => loaderEl.remove(), 320);
      }, 250);
    }

    function setProgress(pct, label, sub){
      prog = Math.max(0, Math.min(100, pct));
      if (progressFillEl) progressFillEl.style.width = prog + "%";
      if (progressPctEl) progressPctEl.textContent = Math.round(prog) + "%";
      if (progressLabelEl && label) progressLabelEl.textContent = label;
      if (loaderSubEl && sub) loaderSubEl.textContent = sub;
    }

    function startFakeProgress(){
      stopFakeProgress();
      prog = 0;
      setProgress(5, "Başlatılıyor", "Bağlantı kuruluyor");
      progTimer = setInterval(() => {
        if (prog < 70) prog += 6;
        else if (prog < 85) prog += 2.5;
        else if (prog < 92) prog += 1;
        setProgress(prog, "Tablolar alınıyor", "Liste hazırlanıyor");
        if (prog >= 92) stopFakeProgress();
      }, 220);
    }

    function stopFakeProgress(){
      if (progTimer) clearInterval(progTimer);
      progTimer = null;
    }

    function syncClear(){
      const has = qEl.value.trim().length > 0;
      clearBtn.style.display = has ? "inline-flex" : "none";
    }

    function setCount(n){
      countBadge.textContent = String(n);
    }

    function setActiveTitle(t){
      if (!activeTitleEl) return;
      activeTitleEl.textContent = t ? (t.name || t.key) : "Bir tablo seç";
    }

    function render(filter=""){
      listEl.innerHTML = "";
      const f = filter.trim().toLowerCase();

      const filtered = TABLES.filter(t =>
        !f || ((t.name || t.key) + " " + t.sheet + " " + t.range).toLowerCase().includes(f)
      );

      setCount(filtered.length);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">Sonuç bulunamadı. Arama kelimesini değiştir.</div>`;
        return;
      }

      filtered.forEach((t, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.dataset.key = t.key;
        btn.innerHTML = `
          <div>
            <div class="name">${(t.name || t.key)}</div>
            <div class="meta">${t.sheet} • ${t.range}</div>
          </div>
          <div style="color:var(--primary); font-weight:900;">›</div>
        `;
        btn.onclick = () => select(t.key);
        listEl.appendChild(btn);

        if (idx === 0 && !frameEl.src) select(t.key);
      });
    }

    // ✅ Mobilde tabloyu tek seferde ekrana sığdır
    function fitMobile(){
      if (!window.matchMedia("(max-width: 980px)").matches) {
        frameEl.style.transform = "";
        frameEl.style.width = "100%";
        frameEl.style.height = "100%";
        return;
      }
      const baseWidth = 720; // Apps Script table min-width
      const w = frameScaleEl ? frameScaleEl.clientWidth : window.innerWidth;
      const scale = Math.max(0.55, Math.min(1, w / baseWidth));
      frameEl.style.transform = `scale(${scale})`;
      frameEl.style.width = `${100/scale}%`;
      frameEl.style.height = `${100/scale}%`;
    }

    function select(key){
      const t = TABLES.find(x => x.key === key);
      if (!t) return;

      document.querySelectorAll(".btn").forEach(b => b.classList.toggle("active", b.dataset.key === key));
      frameEl.src = buildUrl(t);
      location.hash = key;
      setActiveTitle(t);

      // mobilde: seçim yapınca menüyü kapat
      if (window.matchMedia("(max-width: 980px)").matches) {
        closeDrawer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      setTimeout(fitMobile, 260);
    }

    // input events (✅ /hatay yazılırsa baştaki / silinir)
    qEl.addEventListener("input", () => {
      const cleaned = qEl.value.replace(/^\s*\/+/, "");
      if (cleaned !== qEl.value) qEl.value = cleaned;

      render(qEl.value);
      syncClear();
    });

    clearBtn.addEventListener("click", () => {
      qEl.value = "";
      qEl.focus();
      render("");
      syncClear();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== qEl) {
        e.preventDefault();
        openDrawer(); // mobilde arama için menüyü de aç
        qEl.focus();
      }
      if (e.key === "Escape" && document.activeElement === qEl) {
        qEl.value = "";
        render("");
        syncClear();
      }
    });

    window.addEventListener("resize", () => {
      fitMobile();
    });

    window.addEventListener("load", async () => {
      try{
        showLoader();
        statusEl.textContent = "";

        setProgress(18, "Bağlanılıyor", "Google Sheets listesi isteniyor…");
        await loadTables();

        setProgress(75, "Hazırlanıyor", "Arayüz hazırlanıyor…");
        render("");
        syncClear();

        const hash = (location.hash || "").replace("#","");
        if (hash) select(hash);

        hideLoader();
        setTimeout(fitMobile, 320);

        // mobilde açılışta menüyü kapalı tut
        closeDrawer();
      }catch(err){
        stopFakeProgress();
        setProgress(100, "Hata", "Liste yüklenemedi");
        setTimeout(() => {
          if (loaderEl) loaderEl.classList.add("hide");
          setTimeout(() => loaderEl && loaderEl.remove(), 320);
        }, 450);

        statusEl.textContent = "";
        listEl.innerHTML = `<div style="color:#b91c1c; padding:10px; font-weight:800;">
          Liste yüklenemedi: ${String(err)}
        </div>`;
        setCount(0);
      }
    });
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
closeDrawerBtn?.addEventListener("click", closeDrawer);

// Swipe logic
const sidebarEl = document.querySelector(".sidebar");
const edgeSwipeEl = document.getElementById("edgeSwipe");

let swiping = false;
let startX = 0;
let currentX = 0;
let drawerW = 0;

function setDrawerTranslate(px){
  // px: negatif => kapalıya doğru, 0 => açık
  sidebarEl.style.transition = "none";
  sidebarEl.style.transform = `translateX(${px}px)`;
}

function settleDrawer(open){
  sidebarEl.style.transition = "";
  if(open) openDrawer();
  else closeDrawer();
  // transition normale dönsün
  setTimeout(() => { sidebarEl.style.transition = ""; }, 250);
}

function onStart(x){
  if(!window.matchMedia("(max-width: 980px)").matches) return;
  drawerW = sidebarEl.getBoundingClientRect().width;
  swiping = true;
  startX = x;
  currentX = x;
}

function onMove(x){
  if(!swiping) return;
  currentX = x;

  const isOpen = document.body.classList.contains("drawer-open");

  // Açıkken: 0..-drawerW arası sürükle
  // Kapalıyken: -drawerW..0 arası sürükle (kenardan başlatıyoruz)
  let delta = currentX - startX;

  let tx;
  if(isOpen){
    tx = Math.min(0, Math.max(-drawerW, delta)); // sola çekince negatif
  } else {
    // kapalıyken delta pozitif olmalı (sağa)
    tx = Math.min(0, Math.max(-drawerW, -drawerW + delta));
  }

  // overlay görünürlüğü
  document.body.classList.add("drawer-open");
  setDrawerTranslate(tx);
}

function onEnd(){
  if(!swiping) return;
  swiping = false;

  const isOpen = document.body.classList.contains("drawer-open");
  const tx = parseFloat((sidebarEl.style.transform.match(/-?\d+(\.\d+)?/)||["0"])[0]);

  // tx 0’a yakınsa açık, -drawerW’a yakınsa kapalı
  const openedRatio = 1 - (Math.abs(tx) / drawerW); // 0..1
  settleDrawer(openedRatio > 0.45);

  // transform reset (class yönetiyor)
  sidebarEl.style.transform = "";
}

// Dokunma eventleri
function bindSwipe(el){
  el.addEventListener("touchstart", (e) => onStart(e.touches[0].clientX), {passive:true});
  el.addEventListener("touchmove",  (e) => { onMove(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  el.addEventListener("touchend",   onEnd, {passive:true});
}

// 1) Kenardan çekerek aç
bindSwipe(edgeSwipeEl);

// 2) Menünün üstünden/menünün kendisinden çekerek kapat/açıkken sürükle
bindSwipe(sidebarEl);
  </script>
</body>
</html>
